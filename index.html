<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moody Music - Franco S. Di Vilio</title>
    <link rel="stylesheet" href="./CSS/style.css">
</head>
<body>
    <h1>Moody Music</h1>
    <!--Para mí pequeño proyecto, tengo planeado crear una aplicación web interactiva desarrollada con TypeScript llamada Moody Music, 
    orientada a clasificar canciones según diferentes características musicales como energía, alegría, relajación y nostalgia. 
    El usuario podrá modificar estos valores mediante sliders y la aplicación generará una descripción del "mood" de la canción a partir de esos datos.
    Tengo planeado aplicar conceptos de OOP, DOM, eventos y conceptos de API.-->

  <section>
    <h2>My Way</h2> <!-- CANCIÓN 1 -->
    <p>Frank Sinatra</p>

    <audio id="audioMyWay">
      <source src="./audios/My Way.mp3" type="audio/mpeg">
    </audio>

    <button id="botonMyWay">▶</button>

    <input
      type="range"
      id="progresoMyWay"
      min="0"
      max="100"
      value="0"
    >

    <h3>Mood</h3>

    <label for="energiaMyWay">Energía</label>
    <input
      type="range"
      id="energiaMyWay"
      min="0"
      max="100"
      value="50"
    >

    <p>Valor: <span id="valorEnergiaMyWay">50</span></p>

    <label for="alegriaMyWay">Alegría</label>
    <input
      type="range"
      id="alegriaMyWay"
      min="0"
      max="100"
      value="50"
    >

    <p>Valor: <span id="valorAlegriaMyWay">50</span></p>

    <label for="relajacionMyWay">Relajación</label>
    <input
      type="range"
      id="relajacionMyWay"
      min="0"
      max="100"
      value="50"
    >

    <p>Valor: <span id="valorRelajacionMyWay">50</span></p>

    <label for="nostalgiaMyWay">Nostalgia</label>
    <input
      type="range"
      id="nostalgiaMyWay"
      min="0"
      max="100"
      value="50"
    >

    <p>Valor: <span id="valorNostalgiaMyWay">50</span></p>

    <button id="analizarMyWay">Analizar Mood</button>

    <p id="resultadoMyWay"></p>
  </section>
